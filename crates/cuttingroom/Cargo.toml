[package]
name = "cuttingroom"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-channel = "=2.5.0"
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
chrono = "=0.4.45"
cr-project = { path = "../cr-project" }
ctrlc = "=3.5.3"
image = { version = "=0.25.10", default-features = false, features = ["exr", "jpeg", "png", "tiff", "webp"] }
jxl-image-rs-integration = "=0.8.0"
kamadak-exif = "=0.6.2"
libloading = "=0.8.9"
slint = { version = "=1.19.0", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-18",
    "renderer-skia",
] }
turbojpeg-sys = { version = "=1.2.0", default-features = false, features = ["cmake"] }
xmp_toolkit = "=1.12.1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["CGImageProperties", "CGImageSource", "objc2-core-graphics"] }

[build-dependencies]
slint-build = "=1.19.0"

[dev-dependencies]
tempfile = "=3.27.0"
